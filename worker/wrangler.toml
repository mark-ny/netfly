name = "stillframe-playback"
main = "index.js"
compatibility_date = "2025-09-01"
workers_dev = false
preview_urls = false
[observability]
enabled = false
[triggers]
crons = ["17 * * * *"]
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "stillframe-private-media"
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 180, period = 60 }

[[ratelimits]]
name = "REPORT_LIMIT"
namespace_id = "1002"
simple = { limit = 3, period = 60 }
