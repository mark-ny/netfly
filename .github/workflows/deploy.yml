name: Deploy Cloudflare playback Worker
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SITE_ORIGIN: ${{ vars.VITE_SITE_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test && npm run test:db && npm run lint
      - run: |
          test -n "$VITE_SITE_ORIGIN" && test -n "$VITE_SUPABASE_URL"
          npx --yes wrangler@4.76.0 deploy --config worker/wrangler.toml --keep-vars --var "APP_ORIGIN:$VITE_SITE_ORIGIN" --var "SUPABASE_URL:$VITE_SUPABASE_URL"

